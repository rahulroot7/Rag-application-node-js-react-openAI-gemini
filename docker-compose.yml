version: '3.8'

services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-application-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_HOST}/rag_db?retryWrites=true&w=majority
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_at_least_32_characters_long_for_security}
      - JWT_EXPIRES_IN=1d
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_CHAT_MODEL=gpt-4o-mini
      - OPENAI_EMBEDDING_MODEL=text-embedding-3-small
      - EMBEDDING_DIMENSIONS=1536
      - VECTOR_SEARCH_INDEX_NAME=vector_index
      - REDIS_URL=redis://redis:6379
      - ENABLE_REDIS_QUEUE=false
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE=10485760
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - TOP_K=5
      - SIMILARITY_THRESHOLD=0.7
    volumes:
      - ./uploads:/usr/src/app/uploads
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
